name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore test/ExceptionReporter.Tests.csproj

      - name: Build
        run: dotnet build test/ExceptionReporter.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test test/ExceptionReporter.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/ExceptionReporter.csproj

      - name: Build
        run: dotnet build src/ExceptionReporter.csproj --no-restore --configuration Release

      - name: Extract version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace '^v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Pack
        run: dotnet pack src/ExceptionReporter.csproj --no-build --configuration Release -p:Version=${{ env.VERSION }} --output artifacts

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          $pkg = Get-ChildItem artifacts/*.nupkg | Select-Object -First 1 -ExpandProperty FullName
          dotnet nuget push $pkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          $pkg = Get-ChildItem artifacts/*.nupkg | Select-Object -First 1 -ExpandProperty FullName
          dotnet nuget push $pkg --source https://nuget.pkg.github.com/mihula/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
